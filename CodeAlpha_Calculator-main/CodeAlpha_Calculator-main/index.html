<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean and responsive calculator built with HTML, CSS and JavaScript.">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <section class="display" aria-label="Calculator display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </section>

        <section class="keys" aria-label="Calculator buttons">
            <button class="key utility" data-action="clear">AC</button>
            <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
            <button class="key utility" data-action="percent">%</button>
            <button class="key operator" data-value="/">÷</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key operator" data-value="*">×</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key operator" data-value="-">−</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key operator" data-value="+">+</button>

            <button class="key zero" data-value="0">0</button>
            <button class="key" data-value=".">.</button>
            <button class="key equals" data-action="calculate">=</button>
        </section>

        <p class="keyboard-hint">Keyboard supported · Esc to clear · Enter to calculate</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
